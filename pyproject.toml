[project]
name = "climavids-content-sender-telegram"
version = "0.5.0"
description = "Automated Persian content distribution engine for ClimaVids Telegram destinations"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.13.4",
  "cryptography==45.0.7",
  "feedparser==6.0.11",
  "pydantic==2.11.7",
  "requests==2.33.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
climavids = "climavids.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
