[project]
name = "climavids-telegram-content-engine"
version = "0.4.0"
description = "Automated Persian content engine for the ClimaVids Telegram channel"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.13.4",
  "feedparser==6.0.11",
  "pydantic==2.11.7",
  "requests==2.32.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
climavids = "climavids.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
