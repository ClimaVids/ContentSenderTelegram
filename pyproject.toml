[project]
name = "climavids-content-engine"
version = "0.2.0"
description = "Resilient Persian autonomous content engine for ClimaVids"
requires-python = ">=3.11"
dependencies = [
  "feedparser==6.0.11",
  "pydantic==2.11.7",
  "requests==2.32.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
climavids = "climavids.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
