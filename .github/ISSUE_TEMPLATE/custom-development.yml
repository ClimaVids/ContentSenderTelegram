name: Custom development request
description: Request a paid customization, integration, automation, or data task.
title: "[Custom Work] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        For custom or commercial work, please provide enough detail to estimate the task.

  - type: textarea
    id: task
    attributes:
      label: Project or task
      description: What do you need built, fixed, automated, or analyzed?
      placeholder: Describe the desired result.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: What should the final deliverable do or contain?
      placeholder: List the expected files, features, reports, APIs, or workflow.
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Available resources
      description: Add relevant repositories, files, APIs, examples, or documentation.

  - type: input
    id: deadline
    attributes:
      label: Desired deadline
      placeholder: e.g. 2026-10-15

  - type: input
    id: budget
    attributes:
      label: Approximate budget
      description: Optional. A small fixed-budget task is welcome.
      placeholder: e.g. $5–$50

  - type: textarea
    id: contact
    attributes:
      label: Contact preference
      description: You can start the discussion here or provide an appropriate contact method.
