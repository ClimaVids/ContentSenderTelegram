name: ClimaVids Telegram Network Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: climavids-telegram-publisher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }

      - name: Publish due content to the ClimaVids network
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLIMAVIDS_BOT_API_URL: ${{ vars.CLIMAVIDS_BOT_API_URL }}
        run: |
          set -euo pipefail
          python -m climavids.cli publish-network

      - name: Persist public and encrypted private state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json data/private_state.enc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "chore: persist network publication state" || true
          git push origin HEAD:main || true

      - name: Notify owner about publication failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from climavids.owner import send_failure_alert
          send_failure_alert(
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "ClimaVids Telegram Network Publisher",
          )
          PY

      - name: Create GitHub failure issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Telegram network publisher failure — $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "The ContentSenderTelegram network publisher failed. Review the GitHub Actions run and /logs in the owner panel." \
            || true
