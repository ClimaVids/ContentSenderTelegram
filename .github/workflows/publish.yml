name: ClimaVids Telegram Publisher

on:
  schedule:
    # GitHub Actions cron is UTC. Azerbaijan/Iran-style +03:30 local target:
    # 06:19, 09:19, 12:19, 15:19, 18:19 local.
    - cron: '49 2,5,8,11,14 * * *'
  workflow_dispatch:

concurrency:
  group: climavids-publisher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Validate Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"
          python - <<'PY'
import os
chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()
assert chat_id.lstrip('-').isdigit(), 'TELEGRAM_CHAT_ID must be numeric'
print('telegram_chat_id_type=integer')
PY

      - name: Publish one selected post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m climavids.cli publish --limit 1

      - name: Persist publication state
        run: |
          set -euo pipefail
          if [ ! -f data/state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: persist publication state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "State persistence failed after 3 attempts" >&2
          exit 1

      - name: Report failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Telegram publisher failure — $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "Automated publisher failed. Review the failed GitHub Actions run and logs. Secrets are not included in this report." \
            || true
