name: ClimaVids Telegram Publisher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: climavids-publisher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID is missing"; exit 1; }
          python - <<'PY'
          import os
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          if not chat_id.lstrip("-").isdigit():
              raise SystemExit("TELEGRAM_CHAT_ID must be a numeric Telegram chat id")
          print("telegram_chat_id_type=integer")
          PY

      - name: Check daily publication window
        id: schedule
        run: |
          python - <<'PY'
          import json
          import os
          import random
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Asia/Tehran")
          START_TIME = time(12, 0)
          END_TIME = time(23, 50)
          STATE_PATH = Path("data/schedule_state.json")
          STATE_PATH.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(TZ)
          manual_run = os.environ.get("GITHUB_EVENT_NAME", "") == "workflow_dispatch"

          state = {}
          if STATE_PATH.exists():
              try:
                  state = json.loads(STATE_PATH.read_text(encoding="utf-8"))
              except Exception:
                  state = {}

          published_dates = set(state.get("published_dates", []))
          old_slots = state.get("published_slots", {})
          if isinstance(old_slots, dict):
              published_dates.update(
                  key.split("|", 1)[0]
                  for key in old_slots
                  if isinstance(key, str) and "|" in key
              )

          today = now.strftime("%Y-%m-%d")
          should_publish = manual_run or (
              START_TIME <= now.timetz().replace(tzinfo=None) <= END_TIME
              and today not in published_dates
          )

          if not should_publish:
              print(f"publish=false local_time={now.strftime('%Y-%m-%d %H:%M:%S %Z')}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("publish=false\n")
              raise SystemExit(0)

          delay_minutes = 0 if manual_run else random.randint(0, 5)
          publication_key = f"manual-{now.strftime('%Y%m%d-%H%M%S')}" if manual_run else today
          print(
              f"publish=true date={today} key={publication_key} "
              f"local_time={now.strftime('%Y-%m-%d %H:%M:%S %Z')} delay_minutes={delay_minutes}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("publish=true\n")
              f.write(f"publication_key={publication_key}\n")
              f.write(f"publish_date={today}\n")
              f.write(f"delay={delay_minutes}\n")
          PY

      - name: Randomized human-like delay
        if: steps.schedule.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sleep "${{ steps.schedule.outputs.delay }}m"

      - name: Verify Telegram bot access
        if: steps.schedule.outputs.publish == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          response = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20)
          response.raise_for_status()
          data = response.json()
          if not data.get("ok"):
              raise SystemExit(data.get("description", "Telegram getMe failed"))
          print(f"telegram_bot_ok=true username=@{data['result'].get('username', '')}")
          print(f"telegram_chat_id={chat_id}")
          PY

      - name: Publish one selected post
        if: steps.schedule.outputs.publish == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python -m climavids.cli publish --limit 1

      - name: Mark publication day
        if: steps.schedule.outputs.publish == 'true'
        env:
          PUBLICATION_DATE: ${{ steps.schedule.outputs.publish_date }}
          PUBLICATION_KEY: ${{ steps.schedule.outputs.publication_key }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("data/schedule_state.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              state = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              state = {}

          published_dates = state.setdefault("published_dates", [])
          date = os.environ["PUBLICATION_DATE"]
          if date not in published_dates:
              published_dates.append(date)
          state["published_dates"] = sorted(set(published_dates))[-180:]
          state["last_publication"] = {
              "date": date,
              "key": os.environ["PUBLICATION_KEY"],
              "at": datetime.now(ZoneInfo("Asia/Tehran")).isoformat(),
          }
          old_slots = state.get("published_slots", {})
          if isinstance(old_slots, dict):
              state["published_slots"] = dict(sorted(old_slots.items())[-500:])
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Recorded publication day: {date}")
          PY

      - name: Persist publication state
        if: steps.schedule.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json data/schedule_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "chore: persist publication state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "State successfully persisted."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; synchronizing with main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 2))
          done
          echo "State persistence failed after 3 attempts." >&2
          exit 1

      - name: Notify owner about failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || exit 0
          test -n "${TELEGRAM_OWNER_CHAT_ID:-}" || exit 0
          python - <<'PY'
          import os
          import requests
          text = (
              "🚨 خطا در ClimaVids Telegram Content Engine\n\n"
              f"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
              f"Job: ${{ github.job }}\n"
              "لاگ کامل در GitHub Actions موجود است. دستور /logs نیز خلاصه خطاهای ثبت‌شده را نشان می‌دهد."
          )
          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={"chat_id": int(os.environ["TELEGRAM_OWNER_CHAT_ID"]), "text": text, "disable_web_page_preview": True},
              timeout=20,
          ).raise_for_status()
          PY

      - name: Report failure to GitHub Issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "Telegram publisher failure — $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "Automated Telegram publisher failed. Review this GitHub Actions run and its logs. Secrets are not included in this report." \
            || true
