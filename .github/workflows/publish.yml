name: ClimaVids Telegram Publisher

on:
  # GitHub Actions scheduled workflows use UTC cron.
  # We intentionally run every 5 minutes and calculate the real
  # publication time in Asia/Tehran inside Python, so future timezone
  # rule changes do not require manual UTC conversion.
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: climavids-publisher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          test -n "${TELEGRAM_BOT_TOKEN:-}" || {
            echo "TELEGRAM_BOT_TOKEN is missing"
            exit 1
          }

          test -n "${TELEGRAM_CHAT_ID:-}" || {
            echo "TELEGRAM_CHAT_ID is missing"
            exit 1
          }

          python - <<'PY'
          import os

          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()

          if not chat_id.lstrip("-").isdigit():
              raise SystemExit(
                  "TELEGRAM_CHAT_ID must be a numeric Telegram chat id"
              )

          print("telegram_chat_id_type=integer")
          PY

      - name: Check Tehran publication window
        id: schedule
        run: |
          python - <<'PY'
          import json
          import os
          import random
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Asia/Tehran")

          # Target publication times in Tehran local time.
          TARGETS = [
              "07:13",
              "09:47",
              "12:26",
              "15:38",
              "18:54",
              "21:17",
          ]

          STATE_PATH = Path("data/schedule_state.json")
          STATE_PATH.parent.mkdir(parents=True, exist_ok=True)

          now = datetime.now(TZ)

          # Manual runs always publish immediately.
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          manual_run = event_name == "workflow_dispatch"

          state = {}
          if STATE_PATH.exists():
              try:
                  state = json.loads(STATE_PATH.read_text(encoding="utf-8"))
              except Exception:
                  state = {}

          published_slots = state.get("published_slots", {})

          selected_slot = None

          if manual_run:
              selected_slot = f"manual-{now.strftime('%Y%m%d-%H%M%S')}"

          else:
              for target in TARGETS:
                  hour, minute = map(int, target.split(":"))

                  target_dt = now.replace(
                      hour=hour,
                      minute=minute,
                      second=0,
                      microsecond=0,
                  )

                  # We allow the workflow to pick up a target up to
                  # 5 minutes after the target time. This works well
                  # with the GitHub Actions 5-minute scheduler.
                  delta_seconds = (
                      now - target_dt
                  ).total_seconds()

                  if 0 <= delta_seconds <= 300:
                      slot_key = now.strftime("%Y-%m-%d") + "|" + target

                      if slot_key not in published_slots:
                          selected_slot = slot_key

                      break

          if selected_slot is None:
              print(
                  f"publish=false local_time={now.strftime('%Y-%m-%d %H:%M:%S %Z')}"
              )

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("publish=false\n")

              raise SystemExit(0)

          # Natural-looking random delay.
          delay_minutes = random.randint(0, 5)

          print(
              f"publish=true "
              f"slot={selected_slot} "
              f"local_time={now.strftime('%Y-%m-%d %H:%M:%S %Z')} "
              f"delay_minutes={delay_minutes}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("publish=true\n")
              f.write(f"slot={selected_slot}\n")
              f.write(f"delay={delay_minutes}\n")
          PY

      - name: Randomized human-like delay
        if: steps.schedule.outputs.publish == 'true'
        run: |
          set -euo pipefail

          DELAY="${{ steps.schedule.outputs.delay }}"

          echo "Waiting ${DELAY} minute(s) before Telegram publication..."
          sleep "${DELAY}m"

      - name: Publish one selected post
        if: steps.schedule.outputs.publish == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          python -m climavids.cli publish --limit 1

      - name: Mark publication slot
        if: steps.schedule.outputs.publish == 'true'
        env:
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = Path("data/schedule_state.json")
          path.parent.mkdir(parents=True, exist_ok=True)

          try:
              state = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              state = {}

          slots = state.setdefault("published_slots", {})

          slot = os.environ["SLOT"]
          slots[slot] = datetime.now(
              ZoneInfo("Asia/Tehran")
          ).isoformat()

          # Keep only the most recent 500 slots.
          slots = dict(sorted(slots.items())[-500:])

          state["published_slots"] = slots

          path.write_text(
              json.dumps(
                  state,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(f"Recorded publication slot: {slot}")
          PY

      - name: Persist publication state
        if: steps.schedule.outputs.publish == 'true'
        run: |
          set -euo pipefail

          if [ ! -f data/state.json ] && [ ! -f data/schedule_state.json ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/state.json data/schedule_state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: persist publication state"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "State successfully persisted."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; synchronizing with main..."

            git fetch origin main

            git rebase origin/main || {
              git rebase --abort || true
              exit 1
            }

            sleep $((attempt * 2))
          done

          echo "State persistence failed after 3 attempts." >&2
          exit 1

      - name: Report failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh issue create \
            --title "Telegram publisher failure — $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "Automated Telegram publisher failed. Review this GitHub Actions run and its logs. Secrets are not included in this report." \
            || true
