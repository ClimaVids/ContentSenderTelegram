name: Deploy ClimaVids Telegram Bot Interface

on:
  push:
    branches:
      - main
    paths:
      - workers/bot-interface/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker and Telegram webhook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker
        working-directory: workers/bot-interface
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/entry.js
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$TELEGRAM_BOT_TOKEN"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Deploy Worker
        working-directory: workers/bot-interface
        run: npx --yes wrangler@4.127.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Store Telegram token
        working-directory: workers/bot-interface
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4.127.0 secret put TELEGRAM_BOT_TOKEN --config wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Configure Telegram webhook
        run: |
          set -euo pipefail
          export SECRET="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | awk '{print $1}')"
          python - <<'PY' > /tmp/webhook.json
import json, os
print(json.dumps({
    "url": "https://climavids-content-sender-bot.birjand-climate.workers.dev/telegram/webhook",
    "secret_token": os.environ["SECRET"],
    "drop_pending_updates": False,
    "allowed_updates": ["message", "my_chat_member", "channel_post"],
}))
PY
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/webhook.json
          echo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
