name: Collector Smoke Test

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: climavids-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run safe collector
        run: python -m climavids.cli collect
