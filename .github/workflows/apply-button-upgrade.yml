name: Apply Telegram Button Upgrade

on:
  push:
    paths:
      - tools/enable_bot_buttons.py
  workflow_dispatch:

# This workflow intentionally does not write to the default branch.
# The upgrade script is source-transforming automation; changes must be reviewed
# in a normal PR before they are merged/deployed.
permissions:
  contents: read

concurrency:
  group: button-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply button upgrade in a clean working tree
        run: python tools/enable_bot_buttons.py

      - name: Check JavaScript syntax
        run: node --check workers/bot-interface/src/index.js

      - name: Report generated changes for review
        run: |
          if git diff --quiet -- workers/bot-interface/src/index.js; then
            echo "No changes needed"
            exit 0
          fi
          echo "The upgrade script produced source changes. Review and apply them through a pull request."
          git diff --check
          git diff -- workers/bot-interface/src/index.js
          exit 1
