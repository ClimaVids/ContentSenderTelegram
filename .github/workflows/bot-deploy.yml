name: Deploy Telegram Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker source
        working-directory: workers/bot-interface
        run: |
          node --check src/index.js
          node --check src/entry.js

      - name: Deploy Cloudflare Worker
        working-directory: workers/bot-interface
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.127.0 deploy --config wrangler.jsonc

      - name: Install Telegram token in Worker
        working-directory: workers/bot-interface
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4.127.0 secret put TELEGRAM_BOT_TOKEN --config wrangler.jsonc

      - name: Configure Telegram webhook with button callbacks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          export SECRET="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | awk '{print $1}')"
          python - <<'PY' > webhook.json
          import json, os
          print(json.dumps({
              "url": "https://climavids-content-sender-bot.birjand-climate.workers.dev/telegram/webhook",
              "secret_token": os.environ["SECRET"],
              "drop_pending_updates": False,
              "allowed_updates": ["message", "my_chat_member", "channel_post", "callback_query"],
          }))
          PY
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'Content-Type: application/json' \
            --data-binary @webhook.json
          echo

      - name: Verify webhook configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",{}); assert d.get("ok") and r.get("url","").endswith("/telegram/webhook"), d; assert "callback_query" in (r.get("allowed_updates") or []), r; print(json.dumps(r, ensure_ascii=False))'
