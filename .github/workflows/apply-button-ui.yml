name: Apply Telegram Button UI

on:
  push:
    branches: [main]
    paths:
      - tools/patch_owner_ui.py
  workflow_dispatch:

# This workflow is source-transforming automation. It validates the generated
# change but does not write source code directly to the default branch.
permissions:
  contents: read

concurrency:
  group: apply-button-ui
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Apply UI patch
        run: python3 tools/patch_owner_ui.py

      - name: Validate Worker source
        working-directory: workers/bot-interface
        run: |
          node --check src/index.js
          node --check src/entry.js

      - name: Report generated changes for review
        run: |
          if git diff --quiet -- workers/bot-interface/src/index.js; then
            echo "No changes required."
            exit 0
          fi
          echo "The UI patch produced source changes. Review and apply them through a pull request."
          git diff --check
          git diff -- workers/bot-interface/src/index.js
          exit 1
