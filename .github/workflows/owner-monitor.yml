name: ClimaVids Network Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: climavids-network-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }

      - name: Poll Telegram updates and process commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from climavids.owner import poll_updates
          changed = poll_updates()
          print(f"telegram_updates_processed state_changed={changed}")
          PY

      - name: Scheduled owner report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from climavids.owner import send_scheduled_report

          now = datetime.now(ZoneInfo("Asia/Tehran"))
          if now.hour == 9 and now.minute < 5:
              send_scheduled_report("morning")
              print("scheduled_report=morning")
          elif now.hour == 21 and now.minute < 5:
              send_scheduled_report("night")
              print("scheduled_report=night")
          else:
              print("scheduled_report=none")
          PY

      - name: Persist encrypted private state
        run: |
          set -euo pipefail
          if [ ! -f data/private_state.enc ]; then
            echo "No private state yet."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/private_state.enc
          if git diff --cached --quiet; then
            echo "No private state changes."
            exit 0
          fi
          git commit -m "chore: persist encrypted Telegram network state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Encrypted private state persisted."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1

      - name: Report monitor failure to owner
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from climavids.owner import send_failure_alert
          send_failure_alert(
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "ClimaVids Network Monitor",
          )
          PY
