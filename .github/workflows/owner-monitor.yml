name: ClimaVids Legacy Network Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    # Before Cloudflare cutover this remains available. Once the public
    # Worker URL is stored as the repository variable CLIMAVIDS_BOT_API_URL,
    # this legacy polling workflow becomes a no-op and cannot delete the webhook.
    if: vars.CLIMAVIDS_BOT_API_URL == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Poll Telegram updates and process legacy commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -c "from climavids.owner import poll_updates; print(poll_updates())"
      - name: Persist legacy state
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f data/private_state.enc ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/private_state.enc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist legacy Telegram state"
          git push origin HEAD:main || true
