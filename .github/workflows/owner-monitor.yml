name: ClimaVids Owner Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: climavids-owner-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate owner configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "${TELEGRAM_OWNER_CHAT_ID:-}" || { echo "TELEGRAM_OWNER_CHAT_ID is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID is missing"; exit 1; }
          python - <<'PY'
          import os
          for key in ("TELEGRAM_OWNER_CHAT_ID", "TELEGRAM_CHAT_ID"):
              value = os.environ[key].strip()
              if not value.lstrip("-").isdigit():
                  raise SystemExit(f"{key} must be numeric")
          print("owner_monitor_configuration=valid")
          PY

      - name: Process owner commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from climavids.owner import poll_owner_commands
          changed = poll_owner_commands()
          print(f"owner_commands_processed state_changed={changed}")
          PY

      - name: Scheduled owner report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from climavids.owner import send_scheduled_report

          now = datetime.now(ZoneInfo("Asia/Tehran"))
          if now.hour == 9 and now.minute < 15:
              send_scheduled_report("morning")
              print("scheduled_report=morning")
          elif now.hour == 21 and now.minute < 15:
              send_scheduled_report("night")
              print("scheduled_report=night")
          else:
              print("scheduled_report=none")
          PY

      - name: Persist owner monitor state
        run: |
          set -euo pipefail
          if [ ! -f data/owner_state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/owner_state.json
          if git diff --cached --quiet; then
            echo "No owner state changes."
            exit 0
          fi
          git commit -m "chore: persist owner monitor state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Owner state persisted."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

      - name: Report monitor failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          owner = os.environ.get("TELEGRAM_OWNER_CHAT_ID")
          if not token or not owner:
              raise SystemExit(0)
          text = (
              "🚨 ClimaVids Owner Monitor\n\n"
              "سیستم گزارش‌دهی/مانیتورینگ مالک با خطا مواجه شد.\n"
              f"Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": int(owner), "text": text, "disable_web_page_preview": True},
              timeout=20,
          ).raise_for_status()
          PY
