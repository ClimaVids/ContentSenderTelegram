name: Live Telegram Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Telegram identity and publish test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          base = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}"
          with urlopen(Request(f"{base}/getMe"), timeout=20) as response:
              me = json.load(response)
          assert me.get('ok') is True, me

          text = (
              "✅ ContentSenderTelegram — تست واقعی انتشار\n\n"
              "این پیام برای بررسی اتصال ربات به کانال ClimaVids منتشر شده است."
          )
          payload = {"chat_id": "@climavids", "text": text}
          req = Request(
              f"{base}/sendMessage",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(req, timeout=20) as response:
              result = json.load(response)
          assert result.get("ok") is True, result
          message_id = int(result["result"]["message_id"])
          url = f"https://t.me/climavids/{message_id}"
          print(f"telegram_ok=true username=@{me['result'].get('username','')} message_id={message_id} url={url}")
          open("smoke_url.txt", "w", encoding="utf-8").write(url + "\n")
          PY

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-smoke-result
          path: smoke_url.txt
          if-no-files-found: ignore
