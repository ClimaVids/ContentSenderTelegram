name: Live Telegram Smoke Test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    if: github.event.head_commit.message == 'test: live telegram smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send one-time smoke message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"
          export TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID
          python - <<'PY'
import json
import os
from datetime import datetime, timezone
from urllib.request import Request, urlopen

text = (
    "✅ ClimaVids Content Engine — تست واقعی انتشار خودکار\n\n"
    "برای بررسی اتصال امن GitHub Actions به کانال @climavids ارسال شد.\n\n"
    "برای همکاری و تبلیغات پیام دهید\n"
    "ایمانی‌پور | @ClimaVids\n\n"
    "زمان: " + datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
)
payload = {"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}
req = Request(
    f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
    data=json.dumps(payload).encode(),
    headers={"Content-Type": "application/json"},
    method="POST",
)
with urlopen(req, timeout=20) as response:
    result = json.load(response)
assert result.get("ok") is True, result
message_id = int(result["result"]["message_id"])
print(f"telegram_ok=true message_id={message_id}")
PY
