name: Live Telegram Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climavids-telegram-state
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e .
      - name: Verify bot identity and primary channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from climavids.distribution import ensure_primary_destination
          entry = ensure_primary_destination(os.environ["TELEGRAM_BOT_TOKEN"])
          print(f"bot_primary_destination_ok=true title={entry.get('title')} type={entry.get('type')}")
          PY
      - name: Persist encrypted network state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/private_state.enc 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "chore: persist smoke test network state"; fi
          git push origin HEAD:main || true
