name: Code Quality Team

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff yamllint
      - name: Ruff
        run: ruff check src
      - name: YAML lint
        run: yamllint -d relaxed .github workers || true
      - name: Compile Python
        run: python -m compileall -q src
