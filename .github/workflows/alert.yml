name: ClimaVids Automation Failure Alert

on:
  workflow_run:
    workflows:
      - ClimaVids Telegram Network Publisher
      - Collector Smoke Test
      - CI
      - Live Telegram Smoke Test
      - ClimaVids Network Monitor
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create GitHub failure issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 ClimaVids automation failure: ${WORKFLOW_NAME} #${RUN_NUMBER}" \
            --body "Workflow failed.\n\nWorkflow: ${WORKFLOW_NAME}\nRun: ${RUN_NUMBER}\nURL: ${RUN_URL}\n\nThis issue was generated automatically by ContentSenderTelegram."
      - name: Send private owner failure alert
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from climavids.owner import send_failure_alert
          send_failure_alert(os.environ["RUN_URL"], os.environ["WORKFLOW_NAME"])
          PY
