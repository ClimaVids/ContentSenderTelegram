name: ClimaVids Automation Failure Alert

on:
  workflow_run:
    workflows:
      - ClimaVids Telegram Publisher
      - Collector Smoke Test
      - CI
      - Live Telegram Smoke Test
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create GitHub failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "🚨 ClimaVids automation failure: ${WORKFLOW_NAME} #${RUN_NUMBER}" \
            --body "Workflow failed.\n\nWorkflow: ${WORKFLOW_NAME}\nRun: ${RUN_NUMBER}\nURL: ${RUN_URL}\n\nThis issue is generated automatically by the ClimaVids Content Engine."

      - name: Send Telegram alert when alert chat is configured
        if: ${{ env.TELEGRAM_ALERT_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
import json, os
from urllib.request import Request, urlopen

chat_id = os.environ["TELEGRAM_ALERT_CHAT_ID"].strip()
assert chat_id.lstrip("-").isdigit(), "TELEGRAM_ALERT_CHAT_ID must be numeric"
text = (
    "🚨 خطا در ClimaVids Content Engine\n\n"
    f"Workflow: {os.environ['WORKFLOW_NAME']} #{os.environ['RUN_NUMBER']}\n"
    f"{os.environ['RUN_URL']}"
)
req = Request(
    f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
    data=json.dumps({"chat_id": int(chat_id), "text": text}).encode(),
    headers={"Content-Type": "application/json"},
    method="POST",
)
with urlopen(req, timeout=20) as response:
    result = json.load(response)
assert result.get("ok") is True, result
PY
